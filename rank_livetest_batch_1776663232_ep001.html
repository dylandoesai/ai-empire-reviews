<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rank: livetest — This skeleton saw your search history</title>
    <style>
        body { font-family: -apple-system, sans-serif; background: #1a1a2e; color: #eee;
               max-width: 500px; margin: 0 auto; padding: 20px; }
        h1 { font-size: 1.3em; color: #FFD700; }
        .info { background: #16213e; padding: 15px; border-radius: 10px; margin: 15px 0; }
        .info p { margin: 5px 0; }
        .score { font-size: 1.5em; color: #00ff88; }
        video { width: 100%; border-radius: 10px; margin: 15px 0; }
        .rank-btn { display: block; width: 100%; padding: 18px; margin: 8px 0;
                     border: none; border-radius: 10px; font-size: 1.2em; font-weight: bold;
                     color: #fff; cursor: pointer; }
        .rank-btn:hover { opacity: 0.85; transform: scale(1.02); }
        .reject-btn { display: block; width: 100%; padding: 15px; margin: 20px 0 8px 0;
                       background: #cc3333; border: none; border-radius: 10px;
                       font-size: 1em; color: #fff; cursor: pointer; }
        .bonus-section { background: #2a1a4e; padding: 20px; border-radius: 10px; margin: 15px 0; }
        .bonus-section h3 { color: #bb86fc; margin-bottom: 15px; }
        .bonus-btn { display: inline-block; width: 48%; padding: 15px; margin: 1%;
                      border: none; border-radius: 10px; font-size: 1.1em; font-weight: bold;
                      color: #fff; cursor: pointer; }
        .bonus-yes { background: #7c4dff; }
        .bonus-no { background: #555; }
        .done { text-align: center; padding: 40px; }
        .done h2 { color: #00ff88; }
        #ranking-section { }
        #bonus-section { display: none; }
        #done-section { display: none; }
    </style>
</head>
<body>
    <h1>LIVETEST</h1>

    <div class="info">
        <p><strong>Hook:</strong> This skeleton saw your search history</p>
        <p><strong>Topic:</strong> Browser history roast</p>
        <p class="score">Score: 97/100</p>
    </div>

    <p>No preview available</p>

    <div id="ranking-section">
        <h2>Rank this video:</h2>
        
            <button class="rank-btn" onclick="submitRank(1)"
                    style="background: #FFD700;">
                🥇 #1 — Top Pick
            </button>
            <button class="rank-btn" onclick="submitRank(2)"
                    style="background: #C0C0C0;">
                🥈 #2 — Strong
            </button>
            <button class="rank-btn" onclick="submitRank(3)"
                    style="background: #CD7F32;">
                🥉 #3 — Solid
            </button>
            <button class="rank-btn" onclick="submitRank(4)"
                    style="background: #666;">
                4️⃣ #4 — Bonus
            </button>
            <button class="rank-btn" onclick="submitRank(5)"
                    style="background: #444;">
                5️⃣ #5 — Archive
            </button>
        <button class="reject-btn" onclick="submitReject()">❌ Reject</button>
    </div>

    <div id="bonus-section" class="bonus-section" style="display:none;">
        <h3>Post as bonus video?</h3>
        <p>This video ranked #<span id="bonus-rank"></span>. Post it at a bonus timeslot, or archive as evergreen?</p>
        <button class="bonus-btn bonus-yes" onclick="submitBonus(true)">✅ Post as Bonus</button>
        <button class="bonus-btn bonus-no" onclick="submitBonus(false)">📦 Archive</button>
    </div>

    <div id="done-section" class="done">
        <h2 id="done-msg">Ranked!</h2>
        <p>Close this page and open the next ntfy.</p>
    </div>

    <script>
        const NTFY_TOPIC = 'ai-empire-ranking';
        const SERIES = 'livetest';
        const BATCH = 'batch_1776663232';
        const EPISODE = 'ep001';

        let selectedRank = 0;

        async function submitRank(rank) {
            selectedRank = rank;
            document.getElementById('ranking-section').style.display = 'none';

            if (rank >= 4) {
                // Rank 4 or 5 — ask about bonus posting
                document.getElementById('bonus-section').style.display = 'block';
                document.getElementById('bonus-rank').textContent = rank;
            } else {
                // Rank 1-3 — straight to posting bank
                await sendRank(rank, false);
                document.getElementById('done-section').style.display = 'block';
                document.getElementById('done-msg').textContent = 'Ranked #' + rank + ' — Posting slot ' + rank + '!';
            }
        }

        async function submitBonus(isBonus) {
            document.getElementById('bonus-section').style.display = 'none';
            document.getElementById('done-section').style.display = 'block';
            if (isBonus) {
                document.getElementById('done-msg').textContent = 'Ranked #' + selectedRank + ' — Bonus post!';
            } else {
                document.getElementById('done-msg').textContent = 'Ranked #' + selectedRank + ' — Archived as evergreen.';
            }
            await sendRank(selectedRank, isBonus);
        }

        async function sendRank(rank, bonus) {
            try {
                await fetch('https://ntfy.sh/' + NTFY_TOPIC, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'rank',
                        series: SERIES,
                        batch: BATCH,
                        episode: EPISODE,
                        rank: rank,
                        bonus: bonus
                    }),
                    headers: { 'Content-Type': 'application/json' }
                });
            } catch(e) {
                console.error('Failed to send rank:', e);
            }
        }

        async function submitReject() {
            document.getElementById('ranking-section').style.display = 'none';
            document.getElementById('done-section').style.display = 'block';
            document.getElementById('done-msg').textContent = 'Rejected. Fix notes will be requested.';

            try {
                await fetch('https://ntfy.sh/' + NTFY_TOPIC, {
                    method: 'POST',
                    body: JSON.stringify({
                        action: 'reject',
                        series: SERIES,
                        batch: BATCH,
                        episode: EPISODE
                    }),
                    headers: { 'Content-Type': 'application/json' }
                });
            } catch(e) {
                console.error('Failed to send reject:', e);
            }
        }
    </script>
</body>
</html>
